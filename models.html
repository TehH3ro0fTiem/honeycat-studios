<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Available Models - HoneyCat3D</title>
</head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>
                <a href="models.html">Available Models</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>
            </div>
        </nav>
    </header>

    <section class="section">
        <h1>Available Models</h1>

        <div class="filters">
            <select id="artist-filter">
                <option value="">All Artists</option>
            </select>

            <select id="series-filter">
                <option value="">All Series</option>
            </select>
        </div>

        <div class="grid" id="models-grid"></div>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

    <script src="models-data.js"></script>
    <script>
        const grid = document.getElementById("models-grid");
        const artistFilter = document.getElementById("artist-filter");
        const seriesFilter = document.getElementById("series-filter");

        function populateFilterOptions() {
            const artists = [...new Set(MODELS.map(m => m.artist))].sort();
            const series = [...new Set(MODELS.map(m => m.series))].sort();

            artists.forEach(a => {
                const opt = document.createElement("option");
                opt.value = a;
                opt.textContent = a;
                artistFilter.appendChild(opt);
            });

            series.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                seriesFilter.appendChild(opt);
            });
        }

        function renderModels() {
            const artist = artistFilter.value;
            const series = seriesFilter.value;

            const filtered = MODELS.filter(m =>
                (artist === "" || m.artist === artist) &&
                (series === "" || m.series === series)
            );

            grid.innerHTML = filtered.map(m => `
                <div class="card">
                    <a href="model.html?id=${m.id}">
                        <img src="${m.images[0]}" alt="${m.title}">
                    </a>
                    <h3>${m.title}</h3>
                    <a class="btn" href="model.html?id=${m.id}">View Details</a>
                </div>
            `).join("");

            if (filtered.length === 0) {
                grid.innerHTML = "<p>No models match those filters.</p>";
            }
        }

        artistFilter.addEventListener("change", renderModels);
        seriesFilter.addEventListener("change", renderModels);

        populateFilterOptions();
        renderModels();
    </script>

</body>
</html>
